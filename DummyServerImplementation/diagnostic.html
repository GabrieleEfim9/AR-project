<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <script>
    // Custom component to handle dynamic marker reading and API fetching
    AFRAME.registerComponent('dynamic-reader', {
      init: function () {
        // Find the single Master UI Panel in the scene
        const uiPanel = document.getElementById('master-panel');
        this.interval = null;
        this.hideTimeout = null; // Timer for the anti-flickering debounce

        // When the camera detects a marker
        this.el.addEventListener('markerFound', () => {
          // 1. Immediately cancel the hide countdown to prevent flickering
          clearTimeout(this.hideTimeout); 

          // 2. Extract the physical number decoded by the camera
          const barcodeValue = this.el.getAttribute('value');
          console.log("Physical barcode decoded! Value:", barcodeValue);

          // 3. Teleport the 3D panel to this marker to anchor it to reality
          this.el.appendChild(uiPanel);
          uiPanel.setAttribute('visible', 'true');
          
          // 4. Update the title with the decoded number
          document.querySelector('#title-text').setAttribute('value', '--- MACHINE ' + barcodeValue + ' ---');

          // 5. Start fetching data from the server (prevent overlapping intervals)
          if (!this.interval) {
            this.fetchData(barcodeValue);
            this.interval = setInterval(() => this.fetchData(barcodeValue), 3000);
          }
        });

        // When the camera loses tracking of the marker
        this.el.addEventListener('markerLost', () => {
          // Instead of hiding immediately, wait 500ms (Debounce)
          this.hideTimeout = setTimeout(() => {
            uiPanel.setAttribute('visible', 'false');
            clearInterval(this.interval);
            this.interval = null;
          }, 500); 
        });
      },

      fetchData: async function (barcodeValue) {
        try {
          const urlAPI = '/api/diagnostics/machine_' + barcodeValue;
          const answer = await fetch(urlAPI);
          const data = await answer.json();

          // Update the 3D text entities with the JSON payload
          document.querySelector('#battery-text').setAttribute('value', 'Battery: ' + data.battery + '%');
          document.querySelector('#connection-text').setAttribute('value', 'Last Conn: ' + data.last_connection);
          document.querySelector('#signal-text').setAttribute('value', 'Signal: ' + data.signal_level);
        } catch (error) {
          console.error("API Error:", error);
        }
      }
    });
  </script>
</head>
<body style="margin : 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 4x4_bch_13_9_3;">
    
    <a-entity id="master-panel" visible="false">
      <a-plane scale="0.5 0.5 0.5" position="0 0.5 0" rotation="-90 0 0" width="2.5" height="1.5" color="#2c3e50" opacity="0.8">
        <a-text id="title-text" value="--- MACHINE ---" position="-1.1 0.5 0.01" color="#f1c40f" scale="0.4 0.4 0.4"></a-text>
        <a-text id="battery-text" value="Battery: loading..." position="-1.1 0.1 0.01" color="#2ecc71" scale="0.5 0.5 0.5"></a-text>
        <a-text id="connection-text" value="Last Conn: loading..." position="-1.1 -0.2 0.01" color="#ffffff" scale="0.5 0.5 0.5"></a-text>
        <a-text id="signal-text" value="Signal: loading..." position="-1.1 -0.5 0.01" color="#e74c3c" scale="0.5 0.5 0.5"></a-text>
      </a-plane>
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector('a-scene');
      
      // Generate 100 invisible hooks to save RAM. 
      // They include smoothing parameters to reduce 3D jittering.
      for (let i = 0; i < 100; i++) {
        const trackerHTML = `
          <a-marker 
            type="barcode" 
            value="${i}" 
            dynamic-reader 
            smooth="true" 
            smoothCount="10" 
            smoothTolerance="0.01" 
            smoothThreshold="5">
          </a-marker>
        `;
        scene.insertAdjacentHTML('afterbegin', trackerHTML);
      }
    });
  </script>

</body>
</html>
