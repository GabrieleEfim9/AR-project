<!DOCTYPE html>
<html>
<head>
  <!-- Downgrade alla 1.3.0 per massima stabilità su mobile -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <script>
    AFRAME.registerComponent('diagnostic-tracker', {
      schema: { deviceId: {type: 'string'} },
      init: function () {
        this.interval = null;
        
        // Quando inquadri il marker, fa partire la richiesta al server Python
        this.el.addEventListener('markerFound', () => {
          this.fetchData(); 
          this.interval = setInterval(() => this.fetchData(), 3000);
        });
        
        // Quando perdi il marker, ferma le richieste
        this.el.addEventListener('markerLost', () => {
          clearInterval(this.interval);
        });
      },
      fetchData: async function () {
        try {
          const urlAPI = '/api/diagnostics/' + this.data.deviceId;
          const answer = await fetch(urlAPI);
          const data = await answer.json();

          // Inserisce i dati veri dal JSON dentro ai testi del pannello
          this.el.querySelector('.battery-text').setAttribute('value', 'Battery: ' + data.battery + '%');
          this.el.querySelector('.status-text').setAttribute('value', 'Last connection: ' + data.last_connection);
          this.el.querySelector('.temp-text').setAttribute('value', 'Signal: ' + data.signal_level);
        } catch (error) {
          console.error("API Error:", error);
        }
      }
    });
  </script>
</head>
<body style="margin : 0px; overflow: hidden;">

  <a-scene embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 4x4_BCH_13_9_3;"
      vr-mode-ui="enabled: false">
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector('a-scene');
      const numberOfMachines = 100; 

      for (let i = 0; i < numberOfMachines; i++) {
        const markerHTML = `
          <a-marker type="barcode" value="${i}" diagnostic-tracker="deviceId: machine_${i}"
                    smooth="true" smoothCount="5" smoothTolerance="0.05" smoothThreshold="2">
            
            <a-plane scale="0.5 0.5 0.5" position="0 0.5 0" rotation="-90 0 0" width="2.5" height="1.5" color="#2c3e50" opacity="0.8">
              
              <!-- RISOLTO LO SGRETOLAMENTO: Z spostato a 0.1 e aggiunto alpha-test="0.5" -->
              <a-text value="--- MACHINE ${i} ---" position="-1.1 0.5 0.1" color="#f1c40f" scale="0.4 0.4 0.4" alpha-test="0.5"></a-text>
              <a-text class="battery-text" value="Battery: loading..." position="-1.1 0.1 0.1" color="#2ecc71" scale="0.5 0.5 0.5" alpha-test="0.5"></a-text>
              <a-text class="status-text" value="State: loading..." position="-1.1 -0.2 0.1" color="#ffffff" scale="0.5 0.5 0.5" alpha-test="0.5"></a-text>
              <a-text class="temp-text" value="Signal: loading..." position="-1.1 -0.5 0.1" color="#e74c3c" scale="0.5 0.5 0.5" alpha-test="0.5"></a-text>
              
            </a-plane>
            
          </a-marker>
        `;
        scene.insertAdjacentHTML('afterbegin', markerHTML);
      }
    });
  </script>

</body>
</html>
