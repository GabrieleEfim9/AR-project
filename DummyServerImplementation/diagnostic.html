<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <script>
    // Il nostro componente personalizzato (rimane identico a prima)
    AFRAME.registerComponent('diagnostic-tracker', {
      schema: { deviceId: {type: 'string'} },
      init: function () {
        this.interval = null;
        this.el.addEventListener('markerFound', () => {
          this.fetchData(); 
          this.interval = setInterval(() => this.fetchData(), 3000);
        });
        this.el.addEventListener('markerLost', () => {
          clearInterval(this.interval);
        });
      },
      fetchData: async function () {
        try {
          const urlAPI = '/api/diagnostics/' + this.data.deviceId;
          const answer = await fetch(urlAPI);
          const data = await answer.json();

          this.el.querySelector('.battery-text').setAttribute('value', 'Battery: ' + data.battery + '%');
          this.el.querySelector('.status-text').setAttribute('value', 'Last connection: ' + data.last_connection);
          this.el.querySelector('.temp-text').setAttribute('value', 'Signal: ' + data.signal_level);
        } catch (error) {
          console.error("API Error:", error);
        }
      }
    });
  </script>
</head>
<body style="margin : 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <a-entity camera></a-entity>
    
  </a-scene>

  <script>
    // Aspettiamo che la pagina sia caricata
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector('a-scene');
      const numberOfMachines = 64; // Puoi mettere 64, 100, o qualsiasi numero serva!

      // Ciclo che gira 'numberOfMachines' volte
      for (let i = 0; i < numberOfMachines; i++) {
        
        // Creiamo il blocco HTML per il singolo marker, usando `i` in modo dinamico
        const markerHTML = `
          <a-marker type="barcode" value="${i}" diagnostic-tracker="deviceId: machine_${i}">
            <a-plane scale="0.5 0.5 0.5" position="0 0.5 0" rotation="-90 0 0" width="2.5" height="1.5" color="#2c3e50" opacity="0.8">
              <a-text value="--- MACHINE ${i} ---" position="-1.1 0.5 0.01" color="#f1c40f" scale="0.4 0.4 0.4"></a-text>
              <a-text class="battery-text" value="Battery: loading..." position="-1.1 0.1 0.01" color="#2ecc71" scale="0.5 0.5 0.5"></a-text>
              <a-text class="status-text" value="State: loading..." position="-1.1 -0.2 0.01" color="#ffffff" scale="0.5 0.5 0.5"></a-text>
              <a-text class="temp-text" value="Temperature: loading..." position="-1.1 -0.5 0.01" color="#e74c3c" scale="0.5 0.5 0.5"></a-text>
            </a-plane>
          </a-marker>
        `;
        
        // Iniettiamo il blocco appena creato dentro la scena 3D
        scene.insertAdjacentHTML('afterbegin', markerHTML);
      }
    });
  </script>

</body>
</html>
